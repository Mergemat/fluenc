name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Ultracite, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Ultracite
        run: bun run check

      - name: Types
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      # The build regenerates the route tree; a stale committed copy fails here.
      - name: Route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts
