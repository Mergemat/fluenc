name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Ultracite, tests, build and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Ultracite
        run: bun run check

      - name: Tests
        run: bun test

      # The build also generates the route tree that type checking needs.
      - name: Build
        run: bun run build

      - name: Types
        run: bun run typecheck
